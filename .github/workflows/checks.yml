name: Report-only checks

# These steps report problems. They do not fail the pull request yet.
on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: HTML validity
        continue-on-error: true
        run: npx --yes html-validate index.html fellowship.html event.html studentoutcomes.html industry.html 404.html

      - name: Broken internal links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: --offline --no-progress --include-fragments index.html fellowship.html event.html studentoutcomes.html industry.html 404.html

      - name: CSS and JS formatting
        continue-on-error: true
        run: npx --yes prettier --check "css/**/*.css" "js/**/*.js" --ignore-path .prettierignore
