name: Build site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Fail if a built page has no header or fewer than 6 nav links
        run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
