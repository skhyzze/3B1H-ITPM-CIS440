name: Collect newsletter candidates

# Runs ai_brief/build_candidates.py and commits data/newsletter-candidates.json.
# The review desk (circuit-admin/) reads that file. Nothing is published here:
# items only reach The Circuit after someone approves them on the review desk.
on:
  schedule:
    # Mondays at 11:00 UTC (6 or 7 a.m. in Connecticut).
    - cron: "0 11 * * 1"
  # "Run collector" on the review desk starts this, or use Run workflow on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the collector's packages
        run: pip install "feedparser>=6.0.0" "requests>=2.28.0"

      - name: Collect candidates
        run: python ai_brief/build_candidates.py

      - name: Commit the candidates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/newsletter-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update The Circuit candidates'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not push after five attempts' >&2
          exit 1
