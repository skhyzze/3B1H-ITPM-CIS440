<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images_icons/AAI-Logo-Black-Animated-Match.png" type="image/png">
  <link rel="preload" href="fonts/oxanium/oxanium-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>Review Desk | The Circuit</title>
  <link rel="stylesheet" href="css/shared/tokens.css">
  <link rel="stylesheet" href="css/shared/base.css">
  <link rel="stylesheet" href="css/pages/event.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/shared/theme.css">
</head>
<!-- The Worker only sends this page to signed-in reviewers. -->
<body class="page-events page-admin" id="top">
<script>
(function(){try{var saved=localStorage.getItem("lab-theme");if(saved==="dark"||(!saved&&matchMedia("(prefers-color-scheme: dark)").matches))document.body.classList.add("dark");}catch(e){}})();
</script>
  <a class="skip-link" href="#desk">Skip to the review desk</a>

  <header class="lab-header desk-header">
    <nav class="lab-nav" aria-label="Review desk">
      <span class="lab-brand" aria-label="Applied AI Lab">
        <span class="lab-brand-logo" aria-hidden="true">
          <img class="lab-brand-image lab-brand-image-static" src="images_icons/AAI-Logo-Black-Animated-Match.png" alt="" width="1500" height="1500">
        </span>
      </span>
      <span class="desk-header-title">The Circuit · Review Desk</span>
      <button class="lab-theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Light / Dark mode">☾</button>
    </nav>
  </header>

  <main id="main">
    <section class="events-hero admin-hero" aria-labelledby="page-title">
      <span class="lab-orbit lab-orbit-one" aria-hidden="true"></span>
      <span class="lab-orbit lab-orbit-two" aria-hidden="true"></span>
      <div class="container">
        <p class="eyebrow"><span>Team only</span> The Circuit</p>
        <h1 id="page-title">Review<br><em>desk.</em></h1>
        <p class="intro-copy">
          Collect, review, approve. Only the items you approve and publish here
          appear on AI Insights.
        </p>
      </div>
    </section>

    <div class="container admin-body">
      <section class="admin-desk" id="desk" aria-labelledby="desk-title">
        <div class="admin-account">
          <div>
            <p class="eyebrow">Signed in</p>
            <h2 id="desk-title">This week's candidates</h2>
            <p class="admin-meta" id="account-meta"></p>
          </div>
          <div class="admin-actions">
            <button class="button button-ghost" id="collect-button" type="button">Run collector</button>
            <a class="button button-ghost" id="view-link" href="#" target="_blank" rel="noopener">View The Circuit <span aria-hidden="true">↗</span></a>
            <button class="button button-ghost" id="signout-button" type="button">Sign out</button>
          </div>
        </div>

        <p class="admin-message" id="desk-message" role="status" aria-live="polite"></p>

        <dl class="admin-stats" id="stats"></dl>

        <div class="admin-toolbar" role="search" aria-label="Filter candidates">
          <label class="admin-field admin-field-search"><span>Search</span><input id="filter-search" type="search" placeholder="Titles and descriptions" autocomplete="off"></label>
          <label class="admin-field"><span>Source</span><select id="filter-source"><option value="">All sources</option></select></label>
          <label class="admin-field"><span>Section</span><select id="filter-section"><option value="">All sections</option></select></label>
          <label class="admin-field"><span>Status</span>
            <select id="filter-status">
              <option value="">All</option>
              <option value="approved">Approved</option>
              <option value="pending">Not yet approved</option>
            </select>
          </label>
        </div>
        <p class="admin-count" id="result-count" aria-live="polite"></p>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">Approve</th>
                <th scope="col">Spotlight</th>
                <th scope="col">Item</th>
                <th scope="col">Section</th>
                <th scope="col">Picture</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div class="admin-publish" id="publish-bar">
          <p id="publish-summary"></p>
          <button class="button button-primary" id="publish-button" type="button" disabled>Publish to The Circuit</button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/theme.js" defer></script>
  <script src="js/desk.js" defer></script>
</body>
</html>
