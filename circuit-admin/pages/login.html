<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images_icons/AAI-Logo-Black-Animated-Match.png" type="image/png">
  <link rel="preload" href="fonts/oxanium/oxanium-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>Sign in | The Circuit Review Desk</title>
  <link rel="stylesheet" href="css/shared/tokens.css">
  <link rel="stylesheet" href="css/shared/base.css">
  <link rel="stylesheet" href="css/pages/event.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/shared/theme.css">
</head>
<!-- Shares the website's Events styles (hero, buttons, dark mode). css/admin.css adds the desk. -->
<body class="page-events page-admin" id="top">
<script>
(function(){try{var saved=localStorage.getItem("lab-theme");if(saved==="dark"||(!saved&&matchMedia("(prefers-color-scheme: dark)").matches))document.body.classList.add("dark");}catch(e){}})();
</script>
  <header class="lab-header desk-header">
    <nav class="lab-nav" aria-label="Review desk">
      <span class="lab-brand" aria-label="Applied AI Lab">
        <span class="lab-brand-logo" aria-hidden="true">
          <img class="lab-brand-image lab-brand-image-static" src="images_icons/AAI-Logo-Black-Animated-Match.png" alt="" width="1500" height="1500">
        </span>
      </span>
      <span class="desk-header-title">The Circuit · Review Desk</span>
      <button class="lab-theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Light / Dark mode">☾</button>
    </nav>
  </header>

  <main id="main">
    <section class="events-hero admin-hero" aria-labelledby="page-title">
      <span class="lab-orbit lab-orbit-one" aria-hidden="true"></span>
      <span class="lab-orbit lab-orbit-two" aria-hidden="true"></span>
      <div class="container">
        <p class="eyebrow"><span>Team only</span> The Circuit</p>
        <h1 id="page-title">Review<br><em>desk.</em></h1>
        <p class="intro-copy">Sign in to review this week's candidates and publish The Circuit.</p>
      </div>
    </section>

    <div class="container admin-body">
      <section class="admin-panel" aria-labelledby="signin-title">
        <h2 id="signin-title">Sign in</h2>
        <p>Use the team password. Ask the Applied AI Lab team if you need it.</p>
        <form class="admin-signin" id="signin-form">
          <label for="password-input">Password</label>
          <div class="admin-signin-row">
            <input id="password-input" type="password" autocomplete="current-password" required>
            <button class="button button-primary" type="submit">Sign in</button>
          </div>
          <p class="admin-message" id="signin-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="js/theme.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
