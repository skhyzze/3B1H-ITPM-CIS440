<header class="lab-header"{{header-attrs}}>
  <nav class="lab-nav" aria-label="Main navigation">
    <a class="lab-brand" href="{{logo-href}}" aria-label="Applied AI Lab home" data-logo-animated="images_icons/AAI-Animated-Logo-Black.gif" data-logo-duration="2700">
      <span class="lab-brand-logo" aria-hidden="true">
        <img class="lab-brand-image lab-brand-image-static" src="images_icons/AAI-Logo-Black-Animated-Match.png" alt="" width="1500" height="1500">
        <img class="lab-brand-image lab-brand-image-animated" alt="">
      </span>
    </a>
    <div class="lab-nav-links">
      <a href="index.html"{{current:home}}>Home</a>
      <a data-industry-link href="industry.html"{{current:industry}}>Industry Partners</a>
      <a href="fellowship.html"{{current:fellowship}}>Fellowship Pathway</a>
      <a href="studentoutcomes.html"{{current:outcomes}}>Student Outcomes</a>
      <a href="event.html"{{current:events}}>Events</a>
      <a href="ai-insights.html"{{current:insights}}>AI Insights</a>
      <a class="lab-nav-cta" href="index.html#opportunities">Get Involved</a>
      <a class="circuit-join" href="ai-insights.html#subscribe">Join The Circuit</a>
    </div>
    <button class="lab-theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Light / Dark mode">☾</button>
    <div class="lab-lang notranslate">
      <div class="gtranslate_wrapper" aria-hidden="true"></div>
      <ul class="lab-lang-menu" aria-label="Choose site language">
        <li><button type="button" data-gt-lang="en" lang="en" aria-pressed="true">English</button></li>
        <li><button type="button" data-gt-lang="es" lang="es" aria-pressed="false">Español</button></li>
      </ul>
    </div>
    <script>
      window.gtranslateSettings = {
        default_language: "en",
        languages: ["en", "es"],
        wrapper_selector: ".gtranslate_wrapper",
        native_language_names: true
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dropdown.js" defer></script>
  </nav>
</header>
